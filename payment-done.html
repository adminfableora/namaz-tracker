<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Thank you · Namaz Tracker</title><style>
:root{--bg:#f7f5ef;--card:#fff;--ink:#1d2621;--muted:#5d6b63;--brand:#0f6e5c}
@media (prefers-color-scheme:dark){:root{--bg:#0f1512;--card:#18201c;--ink:#e8efe9;--muted:#9fb0a5;--brand:#5fd3b4}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:32px 16px 64px}
header a{color:var(--brand);font-weight:700;text-decoration:none}
nav{display:flex;flex-wrap:wrap;gap:14px;margin:8px 0 24px;font-size:14px}
nav a{color:var(--muted)}
.card{background:var(--card);border-radius:20px;padding:24px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
h1{font-size:28px;line-height:1.2;margin:0 0 6px}h2{font-size:19px;margin:28px 0 6px}
.muted{color:var(--muted);font-size:14px}a{color:var(--brand)}
.btn{display:inline-block;background:var(--brand);color:#fff;padding:12px 20px;border-radius:14px;text-decoration:none;font-weight:700}
</style></head>
<body><main><header>🌙 Namaz Tracker</header>
<div class="card"><h1>Thank you!</h1>
<p>Your payment is being confirmed. Pro turns on automatically when you go back to the app.</p>
<p><a id="back" class="btn" href="#">Return to Namaz Tracker</a></p>
<p class="muted">If the app does not open, open Namaz Tracker yourself and tap <b>Refresh my plan</b>
in Settings → Account.</p></div></main>
<script src="done.js"></script>
</body></html>
